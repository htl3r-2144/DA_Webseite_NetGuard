<script>(function () {
  /* GitHub Pages zeigt diese Datei für jede unbekannte Adresse, auch tief in
     Unterordnern. Damit ./css/… trotzdem gefunden wird, zeigt <base> auf den
     Projektordner (erstes Pfadsegment bei github.io, sonst die Wurzel). */
  var h = location.hostname, seg = location.pathname.split("/")[1] || "";
  var base = (/\.github\.io$/.test(h) && seg && seg.indexOf(".") < 0) ? "/" + seg + "/" : "/";
  document.write('<base href="' + base + '">');
})();</script>
<script>(function () { /* Hell ist Standard; nur eine gespeicherte Wahl schaltet um. */ try { var t = localStorage.getItem('netguard-theme'); document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); } })();</script>
