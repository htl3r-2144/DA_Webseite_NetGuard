<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="NetGuard — Fortinet Security Fabric in der Praxis">
  <!-- Quelle des Social-Preview-Bildes. Die tatsächlich eingebundene Datei ist
       og-image.png, weil die meisten Plattformen kein SVG als og:image lesen.
       Nach Änderungen hier: PNG neu exportieren (1200x630). -->

  <defs>
    <pattern id="raster" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#16181A" opacity="0.10"/>
    </pattern>
    <linearGradient id="verlauf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FAFAF7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#FAFAF7"/>
  <rect width="760" height="420" fill="url(#raster)"/>
  <rect width="1200" height="630" fill="url(#verlauf)"/>
  <rect x="0" y="0" width="6" height="630" fill="#0B6E84"/>

  <!-- Schild -->
  <g transform="translate(80,72)">
    <path d="M26 0 L52 10.2 v17.9 c0 15.9-10.9 26.8-26 30.8C10.9 54.9 0 44 0 28.1 V10.2 Z"
          fill="none" stroke="#0B6E84" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M13.2 28.4 l8.4 8.4 15.2 -16.4"
          fill="none" stroke="#0B6E84" stroke-width="3.6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="152" y="118" font-family="Consolas, monospace" font-size="21"
        letter-spacing="3.4" fill="#63696E">DIPLOMARBEIT 2027</text>

  <text x="80" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="112" font-weight="600" letter-spacing="-4" fill="#16181A">NetGuard</text>

  <text x="80" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="34" fill="#4E5459">Fortinet Security Fabric in der Praxis</text>

  <line x1="80" y1="420" x2="1120" y2="420" stroke="#E5E5DF" stroke-width="1"/>

  <g font-family="Consolas, monospace" font-size="23" fill="#63696E">
    <text x="80"  y="472">FortiGate</text>
    <text x="290" y="472">FortiManager</text>
    <text x="560" y="472">FortiAnalyzer</text>
    <text x="840" y="472">FortiSIEM</text>
  </g>

  <text x="80" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" fill="#4E5459">HTL Wien 3 Rennweg — Höhere Abteilung für Informationstechnologie</text>
</svg>
