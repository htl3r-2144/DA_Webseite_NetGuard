<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>OG-Generator (temporär)</title>
<link rel="stylesheet" href="../css/styles.css">
<style>body{padding:20px;background:#fff} canvas{border:1px solid #ccc;max-width:100%}</style>
</head><body>
<p class="hero-kicker">font warmup</p><h1 style="font-family:var(--font-display)">NETGUARD</h1><code style="font-family:var(--font-mono)">mono</code>
<canvas id="og" width="1200" height="630"></canvas>
<canvas id="ic512" width="512" height="512"></canvas>
<script>
async function ladeBild(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
window.OG = {};
window.render = async function(){
  await document.fonts.load('600 100px "Plex Condensed"');
  await document.fonts.load('500 40px "Plex Condensed"');
  await document.fonts.load('400 20px "JetBrains Mono"');
  await document.fonts.load('400 20px "Inter"');
  const logo = await ladeBild('../assets/logo-htl-slogan.svg');
  const c = document.getElementById('og'); const ctx = c.getContext('2d');
  // Grund
  ctx.fillStyle = '#F2F4F6'; ctx.fillRect(0,0,1200,630);
  // Gewebe rechts
  const STEP=76, OFF=22;
  ctx.save();
  const g = ctx.createLinearGradient(420,0,1200,0); g.addColorStop(0,'rgba(15,23,32,0)'); g.addColorStop(0.35,'rgba(15,23,32,0.13)'); g.addColorStop(1,'rgba(15,23,32,0.13)');
  ctx.strokeStyle = g; ctx.lineWidth = 1;
  for (let x=OFF; x<1200; x+=STEP){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,630); ctx.stroke(); }
  for (let y=OFF; y<630; y+=STEP){ ctx.beginPath(); ctx.moveTo(420,y); ctx.lineTo(1200,y); ctx.stroke(); }
  let i=0;
  for (let x=OFF; x<1200; x+=STEP){ let j=0; for (let y=OFF; y<630; y+=STEP){ if(((i+j)%2)==0 && x>560){ ctx.fillStyle='rgba(15,23,32,0.22)'; ctx.beginPath(); ctx.arc(x,y,2.4,0,7); ctx.fill(); } j++; } i++; }
  // ein paar rote Knoten
  [[782,174],[934,326],[1086,98],[858,478],[1010,250]].forEach(([x,y])=>{ ctx.fillStyle='#BF2117'; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill(); ctx.strokeStyle='rgba(191,33,23,0.35)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,13,0,7); ctx.stroke(); });
  ctx.restore();
  // linker Rand
  ctx.fillStyle = '#BF2117'; ctx.fillRect(0,0,8,630);
  // Kicker
  ctx.fillStyle = '#5C6773'; ctx.font = '400 19px "JetBrains Mono"';
  ctx.letterSpacing = '3px';
  ctx.fillText('DIPLOMARBEIT · HTL WIEN 3 RENNWEG · MATURAJAHRGANG 2027', 72, 96);
  ctx.letterSpacing = '0px';
  // Titel
  // Projektlogo (Mesh Shield). Schild beginnt bei 24/470, daher x-Versatz.
  const ng = await ladeBild('../assets/netguard-logo.svg');
  const nh = 156, nw = nh * 470 / 130;
  ctx.drawImage(ng, 72 - nh * 24 / 130, 118, nw, nh);
  ctx.fillStyle = '#BF2117'; ctx.fillRect(72, 296, 64, 4);
  // Untertitel
  ctx.fillStyle = '#0F1720'; ctx.font = '500 40px "Plex Condensed"';
  ctx.fillText('Threat Detection unter realen Bedingungen', 72, 362);
  ctx.fillStyle = '#3F4A55'; ctx.font = '400 22px "Inter"';
  ctx.fillText('Fortinet Security Fabric im Labor, gemessen vor und nach der Optimierung', 72, 402);
  // Komponenten
  ctx.font = '400 18px "JetBrains Mono"'; let x=72;
  ['FortiGate','FortiManager','FortiAnalyzer','FortiSIEM'].forEach(n=>{ const w=ctx.measureText(n).width+28; ctx.strokeStyle='#BAC3CC'; ctx.lineWidth=1; ctx.fillStyle='#FFFFFF'; rr(ctx,x,452,w,38,6); ctx.fill(); ctx.stroke(); ctx.fillStyle='#3F4A55'; ctx.fillText(n,x+14,478); x+=w+12; });
  // Logo-Plakette unten
  const lh=76, lw=lh*(logo.naturalWidth/logo.naturalHeight);
  ctx.fillStyle='#FFFFFF'; ctx.strokeStyle='#D9DEE3'; rr(ctx,72,530,lw+28,lh+20,10); ctx.fill(); ctx.stroke();
  ctx.drawImage(logo,86,540,lw,lh);
  ctx.fillStyle='#5C6773'; ctx.font='400 16px "JetBrains Mono"';
  ctx.fillText('htl3r-2144.github.io/DA_Webseite_NetGuard', 72+lw+52, 585);
  OG.og = c.toDataURL('image/png');

  // Icons aus favicon.svg
  const fav = await ladeBild('../assets/favicon.svg');
  function icon(size, grund){ const cc=document.createElement('canvas'); cc.width=cc.height=size; const x=cc.getContext('2d'); let r=0; if(grund){ x.fillStyle=grund; x.fillRect(0,0,size,size); r=Math.round(size*0.14); } x.drawImage(fav,r,r,size-2*r,size-2*r); return cc.toDataURL('image/png'); }
  OG.i512 = icon(512); OG.i192 = icon(192); OG.i180 = icon(180, '#FFFFFF'); OG.i32 = icon(32);
  document.getElementById('ic512').getContext('2d').drawImage(fav,0,0,512,512);
  return 'ok';
};
</script>
</body></html>
